# Copy to environments.local.conf (git-ignored) and fill in. Never commit real values.
# One block per environment. The alias is what you type: db.sh dev whoami
# write policy: allowed = --write is enough; confirm = also needs --confirm-env <alias>; never = refused

dev.server=localhost,1433
dev.user=<login>
dev.password=<password>
dev.database=<database>
dev.write=allowed

staging.server=<host,port>
staging.user=<login>
staging.password=<password>
staging.database=<database>
staging.write=confirm

uat.server=<host,port>
uat.user=<login>
uat.password=<password>
uat.database=<database>
uat.write=confirm
